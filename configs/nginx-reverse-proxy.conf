# 1) Redirection : tout ce qui arrive en HTTP est renvoyé vers HTTPS
server {
    listen 80;
    server_name app1.exemple.com;
    return 301 https://$host$request_uri;
}

# 2) Reverse proxy : reçoit en HTTPS et transmet au serveur interne
server {
    listen 443 ssl;
    server_name app1.exemple.com;

    ssl_certificate     /etc/letsencrypt/live/app1.exemple.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app1.exemple.com/privkey.pem;

    location / {
        proxy_pass http://<IP_SERVEUR_INTERNE>:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
