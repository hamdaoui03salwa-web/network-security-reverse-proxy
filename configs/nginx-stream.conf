# Mode "stream" : NGINX relaie du TCP brut (pas du web)
# Ce bloc se place au niveau principal de nginx.conf, en dehors de http { }
stream {

    # Accès SSH vers un serveur interne, via le proxy
    server {
        listen 2201;
        proxy_pass <IP_SERVEUR_INTERNE>:22;

        # Seuls le réseau local et le VPN peuvent entrer
        allow <RESEAU_LAN>;
        allow <RESEAU_VPN>;
        deny all;
    }
}
